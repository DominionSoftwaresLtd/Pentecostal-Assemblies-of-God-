<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#e67e22" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Holy Spirit Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
  <circle cx="250" cy="250" r="172" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Circular Arch Paths for Text -->
  <path id="textArchTop" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
  <path id="textArchBottom" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />

  <!-- Top Curved Text -->
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="21.5" font-weight="900" fill="#f8fafc" letter-spacing="4.5">
    <textPath href="#textArchTop" startOffset="50%" text-anchor="middle">
      PENTECOSTAL ASSEMBLIES OF GOD
    </textPath>
  </text>

  <!-- Bottom Curved Text -->
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#f59e0b" letter-spacing="3">
    <textPath href="#textArchBottom" startOffset="50%" text-anchor="middle">
      NGUNGO ASSEMBLY • MBEERE HQ
    </textPath>
  </text>

  <!-- Decorative Stars on Ring -->
  <polygon points="250,56 253,65 262,65 255,70 257,79 250,74 243,79 245,70 238,65 247,65" fill="#f59e0b" />
  <circle cx="68" cy="250" r="4.5" fill="#f59e0b" />
  <circle cx="432" cy="250" r="4.5" fill="#f59e0b" />

  <!-- Inner Sanctuary Graphic: Bible, Cross & Pentecostal Flame -->
  <g transform="translate(250, 246)">
    <!-- Bible Base -->
    <path d="M -80 75 Q -40 68 0 76 Q 40 68 80 75 L 88 92 Q 40 82 0 92 Q -40 82 -88 92 Z" fill="#334155" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M -80 75 Q -40 68 0 76 L 0 92 Q -40 82 -88 92 Z" fill="#1e293b" />
    <path d="M 0 76 Q 40 68 80 75 L 88 92 Q 40 82 0 92 Z" fill="#475569" />

    <!-- Radiant Glow behind Cross & Flame -->
    <circle cx="0" cy="-20" r="60" fill="url(#flameGrad)" opacity="0.18" filter="url(#glow)" />

    <!-- Latin Cross in Gold -->
    <rect x="-7" y="-80" width="14" height="135" rx="3" fill="url(#goldGrad)" />
    <rect x="-42" y="-55" width="84" height="14" rx="3" fill="url(#goldGrad)" />

    <!-- Pentecostal Tongue of Fire -->
    <path d="M 0 -85 C 22 -60, 32 -35, 20 -10 C 12 5, -8 5, -16 -8 C -26 -24, -14 -46, 0 -85 Z" fill="url(#flameGrad)" filter="url(#glow)" opacity="0.95" />
    <path d="M 0 -72 C 12 -52, 18 -32, 10 -14 C 4 -4, -6 -4, -10 -12 C -15 -22, -8 -38, 0 -72 Z" fill="#ffffff" opacity="0.9" />

    <!-- Golden Rays -->
    <line x1="-55" y1="-85" x2="-40" y2="-72" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="55" y1="-85" x2="40" y2="-72" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="-70" y1="-50" x2="-52" y2="-45" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="70" y1="-50" x2="52" y2="-45" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>